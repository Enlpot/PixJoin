name: Release

# 推 v* 标签（如 v0.3.0）时自动构建并发 GitHub Release；
# 也可手动触发（workflow_dispatch）补跑，需已存在对应 tag
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.3.0，需已推送该 tag）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 版本号 = tag 名（如 v0.3.0），用于产物命名；手动触发时取输入 tag
      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.tag }}"
          } else {
            $v = "${{ github.ref_name }}"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Build
        run: dotnet build PixJoin.sln -c Release

      - name: Unit tests
        run: dotnet run --project tests/PixJoin.Core.Tests -c Release

      - name: Publish self-contained (win-x64, 免安装运行时)
        # 单文件仅打包托管程序集；onnxruntime/libSkiaSharp/VC 等原生库平铺输出目录
        # （IncludeNativeLibrariesForSelfExtract 会触发 ORT 初始化 AV，已实测 0xC0000005）
        shell: pwsh
        run: |
          dotnet publish src/PixJoin.App -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o publish/win-x64

      - name: Publish framework-dependent single-file (win-x64, 需 .NET 9 Desktop Runtime)
        shell: pwsh
        run: |
          dotnet publish src/PixJoin.App -c Release -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o publish/win-x64-fx

      # 中文 v4 模型随包（离线开箱即用 OCR）；下载失败则留待应用首启自动下载
      - name: Bundle OCR v4 models (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($dir in @("publish/win-x64", "publish/win-x64-fx")) {
            $v4 = Join-Path $dir "models/v4"
            New-Item -ItemType Directory -Force -Path $v4 | Out-Null
            curl.exe -sL --max-time 120 -o (Join-Path $v4 "ch_PP-OCRv4_det_mobile.onnx") "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/onnx/PP-OCRv4/det/ch_PP-OCRv4_det_mobile.onnx"
            curl.exe -sL --max-time 180 -o (Join-Path $v4 "ch_PP-OCRv4_rec_mobile.onnx") "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/onnx/PP-OCRv4/rec/ch_PP-OCRv4_rec_mobile.onnx"
            curl.exe -sL --max-time 60 -o (Join-Path $v4 "ppocr_keys_v1.txt") "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/paddle/PP-OCRv4/rec/ch_PP-OCRv4_rec_mobile/ppocr_keys_v1.txt"
          }

      - name: Smoke test (best effort, headless runner 无真实桌面)
        shell: pwsh
        continue-on-error: true
        run: |
          & "publish/win-x64/PixJoin.exe" --selftest

      - name: Package zips + checksums
        # 整个发布目录进包（exe + onnxruntime 等原生库 + models/），缺一不可
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $self  = "publish/PixJoin-$v-win-x64.zip"
          $fx    = "publish/PixJoin-$v-win-x64-fx.zip"
          New-Item -ItemType Directory -Force -Path publish/dist, publish/dist-fx | Out-Null
          Copy-Item publish/win-x64/*    publish/dist/    -Recurse -Force
          Copy-Item publish/win-x64-fx/* publish/dist-fx/ -Recurse -Force
          Compress-Archive -Path publish/dist/*    -DestinationPath $self -Force
          Compress-Archive -Path publish/dist-fx/* -DestinationPath $fx   -Force
          $lines = @(
            "SHA256($(Split-Path $self -Leaf)) = $((Get-FileHash $self -Algorithm SHA256).Hash)",
            "SHA256($(Split-Path $fx -Leaf))   = $((Get-FileHash $fx   -Algorithm SHA256).Hash)"
          )
          $lines | Out-File -FilePath publish/SHA256SUMS.txt -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # push tag 时自动关联；手动触发时按输入 tag 定位（需已存在）
          tag_name: ${{ steps.ver.outputs.version }}
          files: |
            publish/PixJoin-${{ steps.ver.outputs.version }}-win-x64.zip
            publish/PixJoin-${{ steps.ver.outputs.version }}-win-x64-fx.zip
            publish/SHA256SUMS.txt
